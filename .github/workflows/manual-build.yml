name: Build Android APK or AAB (Manual)

# Actions -> Manual Android Build -> Run workflow. AAB requires signing secrets.
on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Android file should be built?
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

permissions:
  contents: read

jobs:
  build:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.15.2
    with:
      flutter-channel: stable
      working-directory: "."
      # JDK 21, not the reusable workflow's default of 17. The Android Gradle
      # Plugin in this project (9.3.1, the version Flutter 3.50 templates use)
      # runs its release lint check on release APKs, and that lint ships code
      # compiled against JDK 21 - on 17 the task dies with
      # 'NoSuchMethodError: java.lang.Object java.util.List.removeLast()'.
      # Nothing in the app needs 21; the toolchain does.
      java-version: "21"
      build-apk: ${{ inputs.format == 'apk' }}
      build-aab: ${{ inputs.format == 'aab' }}
      artifact-retention-days: 14
    secrets:
      # Firebase is optional in this app (guest mode without it), so a build
      # with no file still succeeds. The reusable workflow prefers its
      # google-services-json-base64 input and falls back to this secret, and a
      # secret is the only one of the two a caller can actually fill in here:
      # the `secrets` context is not available in a reusable call's `with:`.
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Optional for apps using ImgBB; extractable from the built APK/AAB.
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
