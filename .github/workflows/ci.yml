name: Flutter CI — Format, Analyze & Test

# Runs on every push to main as well as on demand. The first version of this
# file was manual-only to save CI minutes, but the Android side (Kotlin) can
# only ever be compiled here - a broken service file used to surface days later,
# when someone got round to building an APK. Analyze + test is cheap; finding
# out on release day is not. Set `push:` back to nothing to return to manual.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.15.2
    with:
      flutter-channel: stable
      working-directory: "."
      run-format-check: true
      run-analyze: true
      run-tests: true
      code-coverage: true
      build-apk: false
      build-aab: false
